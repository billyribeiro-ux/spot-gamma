[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotgamma"
version = "0.1.0"
description = "Institutional-grade spot-gamma engine: options chain -> dealer gamma levels."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "typer>=0.9",
    "numpy>=1.24",
]

[project.optional-dependencies]
# urllib3 is imported directly (retry/backoff in sources/_http.py, _http_ms.py);
# the >=2.7.0 floor clears PYSEC-2026-141/142.
live = ["requests>=2.31", "urllib3>=2.7.0"]      # cboe, tradier, schwab, polygon, thetadata
stream = ["requests>=2.31", "urllib3>=2.7.0", "websockets>=12.0"]  # tastytrade (DXLink)
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=8.0", "mypy>=1.19", "types-requests"]

[project.scripts]
spotgamma = "spotgamma.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spotgamma*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
