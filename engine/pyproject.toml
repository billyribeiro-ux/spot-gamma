[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotgamma"
version = "0.1.0"
description = "Institutional-grade spot-gamma engine: options chain -> dealer gamma levels."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "typer>=0.9",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Transitive-dependency CVE floors, enforced so the resolver can never regress:
#   urllib3>=2.7.0  — imported directly for retry/backoff; clears PYSEC-2026-141/142.
#   idna>=3.15      — transitive via requests/httpx; clears CVE-2026-45409.
# (Verified clean: a fresh venv of engine[live,stream,api] reports
#  pip-audit "No known vulnerabilities found".)
live = ["requests>=2.31", "urllib3>=2.7.0", "idna>=3.15"]  # cboe, tradier, schwab, polygon, thetadata
stream = ["requests>=2.31", "urllib3>=2.7.0", "idna>=3.15", "websockets>=12.0"]  # tastytrade (DXLink)
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=8.0", "mypy>=1.19", "types-requests", "bandit>=1.8", "pip-audit>=2.7"]

[project.scripts]
spotgamma = "spotgamma.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spotgamma*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
# Scan shipped code only; tests legitimately use `assert` (B101).
exclude_dirs = ["tests"]
